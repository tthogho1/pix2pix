apiVersion: batch/v1
kind: Job
metadata:
  name: pix2pix-train
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pix2pix
          image: docker.io/tthogho1/pix2pix:latest
          imagePullPolicy: Always
          args:
            # Measured at ~110 sec per 1000 steps on a Tesla T4, so this is
            # roughly 1.3 hours — paired training converges far faster than
            # the unpaired CycleGAN next door.
            - "--data-dir=/workspace/data/anime_pairs"
            - "--steps=40000"
            - "--buffer-size=3400"
            - "--checkpoint-dir=/workspace/output/training_checkpoints"
            - "--log-dir=/workspace/output/logs/"
            - "--sample-dir=/workspace/output/samples"
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: output
              mountPath: /workspace/output
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: pix2pix-output
