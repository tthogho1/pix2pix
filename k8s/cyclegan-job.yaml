apiVersion: batch/v1
kind: Job
metadata:
  name: cyclegan-train
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: cyclegan
          image: docker.io/tthogho1/cyclegan:latest
          imagePullPolicy: Always
          args:
            # Measured at ~800 sec per 1000 steps on a Tesla T4, so each run is
            # roughly 4.5 hours. Two of them cover --total-steps: the first at a
            # constant learning rate, the second decaying it to zero.
            - "--steps=20000"
            - "--total-steps=40000"
            - "--data-dir=/workspace/data/selfie2anime"
            - "--buffer-size=3400"
            # Resume from the newest checkpoint, so a retry does not restart
            # training from scratch. A no-op on the first run.
            - "--restore"
            - "--checkpoint-dir=/workspace/output/cyclegan_checkpoints"
            - "--log-dir=/workspace/output/logs/"
            - "--sample-dir=/workspace/output/samples"
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: output
              mountPath: /workspace/output
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: cyclegan-output
